<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Login · Amara Home Care</title>
  <meta name="description"
    content="Sign in to your Amara Home Care account to manage care schedules, contact care teams, or access caregiver records." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%2316324D%22/><path d=%22M6 17h5l2.5-6 4 12 2.5-6H26%22 stroke=%22%233E7C76%22 stroke-width=%222%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)', surface: 'var(--surface)', ink: 'var(--ink)',
            navy: 'var(--navy)', teal: 'var(--teal)', sage: 'var(--sage)', clay: 'var(--clay)'
          },
          fontFamily: {
            display: ['Fraunces', 'ui-serif', 'serif'],
            sans: ['Public Sans', 'ui-sans-serif', 'sans-serif']
          },
          maxWidth: { '8xl': '1280px' }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>

<body class="bg-bg text-ink font-sans min-h-screen sm:h-screen sm:overflow-hidden flex flex-col justify-center items-center p-4 sm:p-6 relative">
  <div id="page-loader" aria-hidden="true">
    <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="28" stroke="#E4DCCB" stroke-width="2" />
      <path class="thread-path" d="M12 30h9l4.5-11 7 22 4.5-11H48" stroke="#3E7C76" stroke-width="2.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="loader-word">Amara Home Care</span>
  </div>

  <!-- Top-Right Controls (Dark Mode + RTL Toggles) -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-8 z-30 flex items-center gap-2.5">
    <button type="button" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode" class="icon-toggle">
      <svg class="dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" stroke="currentColor" stroke-width="1.7"
          stroke-linejoin="round" />
      </svg>
      <svg class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7" />
        <path
          d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    </button>
    <button type="button" data-dir-toggle aria-label="Toggle text direction"
      class="icon-toggle text-[11px] font-semibold">
      <span data-dir-label>RTL</span>
    </button>
  </div>

  <main class="w-full max-w-[430px] mx-auto my-auto">
    <div class="bg-surface border border-line rounded-3xl p-6 sm:p-7 shadow-xl reveal">

      <!-- Logo & Brand Name (Above Welcome) -->
      <div class="text-center mb-3">
        <a href="index.html" class="inline-flex items-center gap-2.5 group">
          <svg width="36" height="36" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="19" cy="19" r="19" fill="#F2ECDF" />
            <path d="M8 20h5.5l3-7 4.5 14 3-7H30" stroke="#16324D" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="leading-tight text-left">
            <span
              class="block font-display text-lg font-bold text-black dark:text-white group-hover:text-teal transition-colors">Amara</span>
            <span class="block text-[10px] tracking-[0.2em] uppercase text-mute -mt-0.5">Home Care</span>
          </span>
        </a>
      </div>

      <!-- Header / Role info -->
      <div class="text-center mb-4">
        <div id="role-icon-box"
          class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-teal/10 text-teal mb-2 transition-colors">
          <svg id="icon-patient" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <svg id="icon-staff" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3">
            </path>
            <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"></path>
            <circle cx="20" cy="10" r="2"></circle>
          </svg>
        </div>
        <div class="flex items-center justify-center">
          <span id="role-eyebrow" class="eyebrow mb-1">Member Portal</span>
        </div>
        <h1 id="role-title" class="font-display text-xl sm:text-2xl font-semibold text-ink">Welcome Back</h1>
        <p id="role-desc" class="text-xs text-mute mt-0.5">Access your care dashboard, schedules, and communication logs.</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="grid grid-cols-2 gap-1.5 p-1 bg-alt rounded-xl mb-4 text-xs sm:text-sm font-medium" role="tablist">
        <button type="button" id="tab-patient" onclick="switchRole('patient')" role="tab" aria-selected="true"
          class="py-2 rounded-lg bg-surface text-ink font-semibold shadow-sm text-center transition-all cursor-pointer">
          Patient & Family
        </button>
        <button type="button" id="tab-staff" onclick="switchRole('staff')" role="tab" aria-selected="false"
          class="py-2 rounded-lg text-mute hover:text-ink text-center transition-all cursor-pointer">
          Caregiver Staff
        </button>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-3" onsubmit="handleLoginSubmit(event)">
        <div>
          <label id="label-email" for="login-email"
            class="block text-[11px] font-semibold uppercase tracking-wider text-mute mb-1">Email Address</label>
          <input type="text" id="login-email" required placeholder="family@amaracare.example"
            class="w-full px-3.5 py-2.5 rounded-xl border border-line bg-surface text-ink placeholder:text-mute/60 focus:outline-none focus:border-teal transition-colors text-sm" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password"
              class="block text-[11px] font-semibold uppercase tracking-wider text-mute">Password</label>
            <a href="#" class="text-xs text-teal hover:underline font-medium">Forgot?</a>
          </div>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••"
              class="w-full px-3.5 py-2.5 rounded-xl border border-line bg-surface text-ink placeholder:text-mute/60 focus:outline-none focus:border-teal transition-colors text-sm pr-10" />
            <button type="button"
              onclick="const p=document.getElementById('login-password'); p.type = p.type==='password'?'text':'password';"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-mute hover:text-ink p-1 cursor-pointer"
              aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-0.5">
          <input type="checkbox" id="remember-me"
            class="w-3.5 h-3.5 rounded border-line text-teal focus:ring-teal cursor-pointer" />
          <label for="remember-me" class="text-xs text-mute cursor-pointer">Remember my device for 30 days</label>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary w-full !py-2.5 !text-sm mt-1 cursor-pointer">
          Sign In to Portal
        </button>
      </form>

      <div id="footer-help-box" class="mt-3.5 pt-3.5 border-t border-line text-center text-xs text-mute">
        <span id="footer-help-text">Need immediate home care assistance?</span>
        <a id="footer-help-link" href="contact.html" class="text-teal font-semibold hover:underline block mt-0.5">Book a Care Consultation →</a>
      </div>

    </div>

    <!-- Minimal Copyright -->
    <p class="text-center text-[11px] text-mute mt-3">© 2026 Amara Home Care. All rights reserved.</p>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    var currentRole = 'patient';

    function switchRole(role) {
      currentRole = role;
      var tabPatient = document.getElementById('tab-patient');
      var tabStaff = document.getElementById('tab-staff');
      var iconPatient = document.getElementById('icon-patient');
      var iconStaff = document.getElementById('icon-staff');
      var roleEyebrow = document.getElementById('role-eyebrow');
      var roleTitle = document.getElementById('role-title');
      var roleDesc = document.getElementById('role-desc');
      var labelEmail = document.getElementById('label-email');
      var inputEmail = document.getElementById('login-email');
      var submitBtn = document.getElementById('submit-btn');
      var footerText = document.getElementById('footer-help-text');
      var footerLink = document.getElementById('footer-help-link');

      var activeClasses = ['bg-surface', 'text-ink', 'font-semibold', 'shadow-sm'];
      var inactiveClasses = ['text-mute', 'hover:text-ink'];

      if (role === 'staff') {
        // Update tab buttons
        activeClasses.forEach(function (c) {
          tabPatient.classList.remove(c);
          tabStaff.classList.add(c);
        });
        inactiveClasses.forEach(function (c) {
          tabPatient.classList.add(c);
          tabStaff.classList.remove(c);
        });
        tabPatient.setAttribute('aria-selected', 'false');
        tabStaff.setAttribute('aria-selected', 'true');

        // Update icon
        if (iconPatient) iconPatient.classList.add('hidden');
        if (iconStaff) iconStaff.classList.remove('hidden');

        // Update labels and text
        if (roleEyebrow) roleEyebrow.textContent = 'Caregiver Staff Portal';
        if (roleTitle) roleTitle.textContent = 'Staff Sign In';
        if (roleDesc) roleDesc.textContent = 'Log in to view assigned patient shifts, clinical notes, and daily schedules.';
        if (labelEmail) labelEmail.textContent = 'Caregiver Email or Staff ID';
        if (inputEmail) inputEmail.placeholder = 'sarah.care@amaracare.example or CG-1042';
        if (submitBtn) submitBtn.textContent = 'Sign In to Caregiver Portal';
        if (footerText) footerText.textContent = 'Interested in working with Amara?';
        if (footerLink) {
          footerLink.textContent = 'View Open Caregiver Positions →';
          footerLink.href = 'caregivers.html';
        }
      } else {
        // Update tab buttons
        activeClasses.forEach(function (c) {
          tabStaff.classList.remove(c);
          tabPatient.classList.add(c);
        });
        inactiveClasses.forEach(function (c) {
          tabStaff.classList.add(c);
          tabPatient.classList.remove(c);
        });
        tabStaff.setAttribute('aria-selected', 'false');
        tabPatient.setAttribute('aria-selected', 'true');

        // Update icon
        if (iconPatient) iconPatient.classList.remove('hidden');
        if (iconStaff) iconStaff.classList.add('hidden');

        // Update labels and text
        if (roleEyebrow) roleEyebrow.textContent = 'Member Portal';
        if (roleTitle) roleTitle.textContent = 'Welcome Back';
        if (roleDesc) roleDesc.textContent = 'Access your care dashboard, schedules, and communication logs.';
        if (labelEmail) labelEmail.textContent = 'Email Address';
        if (inputEmail) inputEmail.placeholder = 'family@amaracare.example';
        if (submitBtn) submitBtn.textContent = 'Sign In to Portal';
        if (footerText) footerText.textContent = 'Need immediate home care assistance?';
        if (footerLink) {
          footerLink.textContent = 'Book a Care Consultation →';
          footerLink.href = 'contact.html';
        }
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value;
      if (currentRole === 'staff') {
        alert('Welcome back, staff member (' + email + ')! Redirecting to Caregiver Portal...');
        window.location.href = 'caregivers.html';
      } else {
        alert('Welcome back (' + email + ')! Redirecting to Patient & Family dashboard...');
        window.location.href = 'index.html';
      }
    }

    // Check if ?role=staff was passed in URL
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'staff') {
      switchRole('staff');
    }
  </script>
</body>

</html>
